name: Data Pipeline - CAGED Agro

on:
  schedule:
    # Dia 5 de cada mês, 8:00 UTC. O último mês publicado é descoberto listando o FTP.
    - cron: '0 8 5 * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Reprocessar todos os arquivos do fato'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write  # disparar o deploy (push com GITHUB_TOKEN não dispara workflows)

concurrency:
  group: "data-pipeline"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CAGED_CACHE_DIR: data/cache

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # download incremental -> fato -> regionais -> cubo -> reconciliação -> testes Python
      - name: Run pipeline
        run: python scripts/run_pipeline.py ${{ github.event.inputs.force_rebuild == 'true' && '--force' || '' }}

      - name: Build agregado
        run: node scripts/build_agregado.mjs

      - name: Engine consistency tests
        run: |
          python scripts/tests/run_oracle.py "$RUNNER_TEMP/oracle.json"
          node scripts/tests/run_engine.mjs scripts/tests/cases.json "$RUNNER_TEMP/engine.json"
          python scripts/tests/compare.py "$RUNNER_TEMP/oracle.json" "$RUNNER_TEMP/engine.json"

      - name: Check for changes
        id: check
        run: |
          git add data/fact dashboard/public/data/v2 docs/RECONCILIACAO.md
          # só dado novo conta: dims.version/agregado.atualizacao/RECONCILIACAO levam a data do run
          if git diff --cached --quiet -- data/fact; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update data"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            [ "$i" = 3 ] && exit 1
            sleep 5
          done

      - name: Trigger deploy
        if: steps.check.outputs.changed == 'true' && github.ref_name == 'main'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        if: always()
        run: |
          echo "## Data Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Data updated:** ${{ steps.check.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          ls -la dashboard/public/data/v2/cubo >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
